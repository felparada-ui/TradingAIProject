[project]
name = "trading-bot-crew"
version = "0.1.0"
description = "Trading bot with CrewAI agents for MT5 data analysis"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.30.0",
    "crewai-tools>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ta>=0.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0"
]
